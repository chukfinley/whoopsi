[project]
name = "whoop-algorithms"
version = "0.1.0"
description = "Replicate Whoop metrics (Recovery, Sleep, Strain) from raw sensor data"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "sleepecg>=0.5",
    "matplotlib>=3.7",
    "tensorflow-cpu>=2.20.0",
]
