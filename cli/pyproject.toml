[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whoop-cli"
version = "0.1.0"
description = "CLI tool for extracting and analyzing Whoop 4.0/5.0 data"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
]

[project.scripts]
whoop = "whoop_cli.main:cli"

[project.optional-dependencies]
analysis = ["numpy", "pandas", "scipy"]
